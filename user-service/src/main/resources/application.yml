server:
  port: 8082
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048

spring:
  application:
    name: user-service
  
  # Spring Cloud 버전 호환성 체크 비활성화
  cloud:
    compatibility-verifier:
      enabled: false
    openfeign:
      compression:
        request:
          enabled: true
          min-request-size: 2048
          mime-types: text/xml,application/xml,application/json
        response:
          enabled: true
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: 1000
            max-connections-per-route: 200
            time-to-live: 900
            time-to-live-unit: seconds
    aws:
      s3:
        bucket: idol--bucket-2026-service
      credentials:
        access-key: ${AWS_ACCESS_KEY:YOUR_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY:YOUR_SECRET_KEY}
      region:
        static: ap-northeast-2
      stack:
        auto: false

  datasource:
    url: jdbc:mysql://localhost:3307/idol_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false # OSIV 끄기 (성능 최적화)

  # MongoDB 설정 (조회용)
  data:
    mongodb:
      host: localhost
      port: 27017
      database: idol_user_view

    # Redis 설정
    redis:
      host: localhost
      port: 6379

  # Kafka 설정
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: user-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    topic:
      user-update: user-update-topic # 추가됨
      notify-request: notify-request-topic # 추가됨

  # 파일 업로드 크기 제한 (10MB)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Swagger 설정
springdoc:
  servers:
    - url: http://localhost:8000
      description: Gateway Server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

