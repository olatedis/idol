version: '3.8'

services:
  # --- 인프라 레이어 ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: idol-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 6000
    networks:
      - idol-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: idol-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 120000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${AWS_PUBLIC_IP:-localhost}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - idol-network

  redis:
    image: redis:latest
    container_name: idol-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    networks:
      - idol-network

  db:
    image: mysql:8.0
    container_name: idol-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=idol_db
      - TZ=UTC
    ports:
      - "3306:3306"
    networks:
      - idol-network

  mongo:
    image: mongo:latest
    container_name: idol-mongo
    networks:
      - idol-network

  elasticsearch:
    container_name: idol-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    networks:
      - idol-network

  # --- 백엔드 서비스 (Spring Boot) ---
  discovery-service:
    image: ${DOCKERHUB_USERNAME}/idol-discovery:latest
    container_name: discovery-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - idol-network

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/idol-gateway:latest
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-your-very-long-and-secure-random-string-idol-link-project}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-http://localhost:5173/oauth/kakao}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - EUREKA_URL=http://discovery-service:8761/eureka/
    ports:
      - "8000:8080"
    depends_on:
      - discovery-service
      - redis
    networks:
      - idol-network

  auth-service:
    image: ${DOCKERHUB_USERNAME}/idol-auth:latest
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-your-very-long-and-secure-random-string-idol-link-project}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-http://localhost:5173/oauth/kakao}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - discovery-service
      - redis
      - kafka
    networks:
      - idol-network

  user-service:
    image: ${DOCKERHUB_USERNAME}/idol-user:latest
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
    depends_on:
      - discovery-service
      - db
      - mongo
    networks:
      - idol-network

  chat-service:
    image: ${DOCKERHUB_USERNAME}/idol-chat:latest
    container_name: chat-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
    depends_on:
      - discovery-service
      - mongo
      - kafka
    networks:
      - idol-network

  board-service:
    image: ${DOCKERHUB_USERNAME}/idol-board:latest
    container_name: board-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - INTERNAL_KEY=${INTERNAL_KEY}
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  vote-service:
    image: ${DOCKERHUB_USERNAME}/idol-vote:latest
    container_name: vote-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  concert-service:
    image: ${DOCKERHUB_USERNAME}/idol-concert:latest
    container_name: concert-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  payment-service:
    image: ${DOCKERHUB_USERNAME}/idol-payment:latest
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - GATEWAY_URL=http://api-gateway:8080
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  reserve-service:
    image: ${DOCKERHUB_USERNAME}/idol-reserve:latest
    container_name: reserve-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  subscription-service:
    image: ${DOCKERHUB_USERNAME}/idol-subscription:latest
    container_name: subscription-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  notification-service:
    image: ${DOCKERHUB_USERNAME}/idol-notification:latest
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - discovery-service
      - db
    networks:
      - idol-network

  fanout-service:
    image: ${DOCKERHUB_USERNAME}/idol-fanout:latest
    container_name: fanout-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - discovery-service
      - kafka
    networks:
      - idol-network

  ranking-service:
    image: ${DOCKERHUB_USERNAME}/idol-ranking:latest
    container_name: ranking-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - idol-network

  search-service:
    image: ${DOCKERHUB_USERNAME}/idol-search:latest
    container_name: search-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - elasticsearch
    networks:
      - idol-network

  # --- 프론트엔드 ---
  frontend:
    image: ${DOCKERHUB_USERNAME}/idol-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - idol-network

networks:
  idol-network:
    driver: bridge
