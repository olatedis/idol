version: '3.8'

services:
  # --- 인프라 레이어 ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: idol-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idol-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: idol-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 120000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${AWS_PUBLIC_IP:-localhost}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - idol-network
    volumes:
      - kafka_data:/var/lib/kafka/data

  redis:
    image: redis:latest
    container_name: idol-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    networks:
      - idol-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    container_name: idol-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=idol_db
      - TZ=UTC
    ports:
      - "3306:3306"
    networks:
      - idol-network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: idol-mongo
    networks:
      - idol-network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    container_name: idol-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    networks:
      - idol-network
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # 플러그인 설치 후 실행
    command: >
      /bin/sh -c "
        if [ ! -d plugins/analysis-nori ]; then
          ./bin/elasticsearch-plugin install --batch analysis-nori;
        fi;
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 5

  # --- 백엔드 서비스 (Spring Boot) ---
  discovery-service:
    image: ${DOCKERHUB_USERNAME}/idol-discovery:latest
    container_name: discovery-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - idol-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/idol-gateway:latest
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-your-very-long-and-secure-random-string-idol-link-project}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-http://localhost:5173/oauth/kakao}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - SPRING_DATA_REDIS_HOST=idol-redis
    ports:
      - "8000:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  auth-service:
    image: ${DOCKERHUB_USERNAME}/idol-auth:latest
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-your-very-long-and-secure-random-string-idol-link-project}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-http://localhost:5173/oauth/kakao}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - idol-network

  user-service:
    image: ${DOCKERHUB_USERNAME}/idol-user:latest
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  chat-service:
    image: ${DOCKERHUB_USERNAME}/idol-chat:latest
    container_name: chat-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  board-service:
    image: ${DOCKERHUB_USERNAME}/idol-board:latest
    container_name: board-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - INTERNAL_KEY=${INTERNAL_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  vote-service:
    image: ${DOCKERHUB_USERNAME}/idol-vote:latest
    container_name: vote-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - idol-network

  concert-service:
    image: ${DOCKERHUB_USERNAME}/idol-concert:latest
    container_name: concert-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  payment-service:
    image: ${DOCKERHUB_USERNAME}/idol-payment:latest
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - GATEWAY_URL=${GATEWAY_URL:-http://api-gateway:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  reserve-service:
    image: ${DOCKERHUB_USERNAME}/idol-reserve:latest
    container_name: reserve-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  subscription-service:
    image: ${DOCKERHUB_USERNAME}/idol-subscription:latest
    container_name: subscription-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idol-network

  notification-service:
    image: ${DOCKERHUB_USERNAME}/idol-notification:latest
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SPRING_DATA_REDIS_HOST=idol-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - idol-network

  fanout-service:
    image: ${DOCKERHUB_USERNAME}/idol-fanout:latest
    container_name: fanout-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - idol-network

  ranking-service:
    image: ${DOCKERHUB_USERNAME}/idol-ranking:latest
    container_name: ranking-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=idol-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - idol-network

  search-service:
    image: ${DOCKERHUB_USERNAME}/idol-search:latest
    container_name: search-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - idol-network

  # --- 프론트엔드 ---
  frontend:
    image: ${DOCKERHUB_USERNAME}/idol-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - idol-network

networks:
  idol-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  es_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
