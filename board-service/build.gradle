plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bit.docker'
version = '0.0.1-SNAPSHOT'
description = 'board-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

/**
 * ??Spring Cloud ?�존??버전 ?�합(BOM)
 * - OpenFeign / Eureka / Tracing ?�을 ?�정?�으�?받기 ?�해 ?�요
 */
ext {
    set('springCloudVersion', "2024.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Kafka (notify-request-topic producer)
    implementation 'org.springframework.kafka:spring-kafka'

    // Redis (for StringRedisTemplate and user status caching checks)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // Redis session (?말 ???만 ??)
    implementation 'org.springframework.session:spring-session-data-redis'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // Eureka Client
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Jackson Afterburner (JSON ?�능 ?�닝) - 추�???
    implementation 'com.fasterxml.jackson.module:jackson-module-afterburner'

    // Lombok / Devtools / DB
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

