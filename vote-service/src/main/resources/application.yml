server:
  port: 8083

spring:
  application:
    name: voting-service

  datasource:
    url: jdbc:mysql://localhost:3307/idol_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD:1234} # 기본값 1234 설정
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500 # JPA Batch Size 설정
    open-in-view: false # OSIV 끄기 (성능 최적화)

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      max-poll-records: 500 # 한 번에 최대 500개 가져옴
    listener:
      type: batch # 배치 리스너 활성화

  # Feign 설정 (HttpClient 5 적용 + 튜닝)
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: 1000
            max-connections-per-route: 200
            time-to-live: 900
            time-to-live-unit: seconds

# Swagger 설정 (Gateway 주소 명시)
springdoc:
  servers:
    - url: http://localhost:8000
      description: Gateway Server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Resilience4j 설정
resilience4j:
  circuitbreaker:
    instances:
      redis-vote: # 서킷 브레이커 이름
        registerHealthIndicator: true
        slidingWindowSize: 10 # 최근 10개 요청 기준
        minimumNumberOfCalls: 5 # 최소 5번 호출 후 판단
        permittedNumberOfCallsInHalfOpenState: 3 # 반열림 상태에서 3번 테스트
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s # 차단 후 10초 대기
        failureRateThreshold: 50 # 실패율 50% 이상이면 차단
        eventConsumerBufferSize: 10

  # RateLimiter 설정 (DB 보호용)
  ratelimiter:
    instances:
      vote-db-protection:
        limitForPeriod: 500      # 1초에 500개 허용 (DB 스펙에 따라 조절)
        limitRefreshPeriod: 1s
        timeoutDuration: 0       # 대기 없이 즉시 거절 (Fail Fast)
