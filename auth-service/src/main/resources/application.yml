server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  # 기본값 설정 (주의: 실제 운영 시에는 반드시 환경 변수로 덮어씌워야 함)
  secret: ${JWT_SECRET:your-very-long-and-secure-random-string-idol-link-project}
  access-expiration: 3600000
  refresh-expiration: 1209600000

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
