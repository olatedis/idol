server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048

spring:
  application:
    name: auth-service
  data:
    redis:
      host: localhost
      port: 6379

  # 이메일 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Feign 설정 (HttpClient 5 적용 + 튜닝)
  cloud:
    openfeign:
      compression:
        request:
          enabled: true
          min-request-size: 2048
          mime-types: text/xml,application/xml,application/json
        response:
          enabled: true
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: 1000
            max-connections-per-route: 200
            time-to-live: 900
            time-to-live-unit: seconds

# 카카오 로그인 설정 (추가됨)
kakao:
  client-id: ${KAKAO_CLIENT_ID:your-kakao-rest-api-key}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

# gRPC Server 설정
grpc:
  server:
    port: 9091

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      user-service:
        baseConfig: default

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-random-string-idol-link-project}
  access-expiration: 1200000 # 20분 (20 * 60 * 1000)
  refresh-expiration: 1209600000 # 2주

