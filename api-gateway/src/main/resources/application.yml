server:
  port: 8000
  http2:
    enabled: true # HTTP/2 활성화

spring:
  application:
    name: apigateway-service
  
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      # CORS 설정 (전역) - 프론트엔드(5173) 전용
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173" # 프론트엔드 주소
              - "http://localhost:8000" # Swagger UI (Gateway 자신)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # --- Core Services ---
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 초당 5개 토큰 충전
                redis-rate-limiter.burstCapacity: 10  # 최대 10개까지 버스트 허용
                key-resolver: "#{@ipKeyResolver}"     # IP 기준 제한
        
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**, /reports/**, /internal/**, /agencies/**, /admin/users/**, /idols/**

        # --- Community Services ---
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chat/**, /ws-chat/**

        - id: board-service
          uri: lb://BOARD-SERVICE
          predicates:
            - Path=/board/posts/**, /board/comments/**

        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/search/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # --- Activity Services ---
        - id: voting-service
          uri: lb://VOTING-SERVICE
          predicates:
            - Path=/api/votes/**, /api/admin/votes/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: ranking-service
          uri: lb://RANKING-SERVICE
          predicates:
            - Path=/ws-ranking/**, /api/rankings/**

        - id: concert-service
          uri: lb://CONCERT-SERVICE
          predicates:
            - Path=/concerts/**

        - id: reserve-service
          uri: lb://RESERVE-SERVICE
          predicates:
            - Path=/reservations/**

        # --- Support Services ---
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**

        - id: subscription-service
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/subscriptions/**

        # --- Notify Service ---
        - id: notify-service
          uri: lb://NOTIFY-SERVICE
          predicates:
            - Path=/sse/notifications, /notify/**

        # --- Swagger API Docs ---
        - id: openapi-auth
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: openapi-user
          uri: lb://USER-SERVICE
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: openapi-vote
          uri: lb://VOTING-SERVICE
          predicates:
            - Path=/v3/api-docs/vote-service
          filters:
            - RewritePath=/v3/api-docs/vote-service, /v3/api-docs

        - id: openapi-chat
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/v3/api-docs/chat-service
          filters:
            - RewritePath=/v3/api-docs/chat-service, /v3/api-docs
            
        - id: openapi-board
          uri: lb://BOARD-SERVICE
          predicates:
            - Path=/v3/api-docs/board-service
          filters:
            - RewritePath=/v3/api-docs/board-service, /v3/api-docs

        - id: openapi-search
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/v3/api-docs/search-service
          filters:
            - RewritePath=/v3/api-docs/search-service, /v3/api-docs

        - id: openapi-concert
          uri: lb://CONCERT-SERVICE
          predicates:
            - Path=/v3/api-docs/concert-service
          filters:
            - RewritePath=/v3/api-docs/concert-service, /v3/api-docs

        - id: openapi-payment
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs
            
        - id: openapi-ranking
          uri: lb://RANKING-SERVICE
          predicates:
            - Path=/v3/api-docs/ranking-service
          filters:
            - RewritePath=/v3/api-docs/ranking-service, /v3/api-docs

        - id: openapi-reserve
          uri: lb://RESERVE-SERVICE
          predicates:
            - Path=/v3/api-docs/reserve-service
          filters:
            - RewritePath=/v3/api-docs/reserve-service, /v3/api-docs

        - id: openapi-subscription
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/v3/api-docs/subscription-service
          filters:
            - RewritePath=/v3/api-docs/subscription-service, /v3/api-docs
            
        - id: openapi-notify
          uri: lb://NOTIFY-SERVICE
          predicates:
            - Path=/v3/api-docs/notify-service
          filters:
            - RewritePath=/v3/api-docs/notify-service, /v3/api-docs

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# Swagger UI 설정
springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Chat Service
        url: /v3/api-docs/chat-service
      - name: Vote Service
        url: /v3/api-docs/vote-service
      - name: Board Service
        url: /v3/api-docs/board-service
      - name: Search Service
        url: /v3/api-docs/search-service
      - name: Concert Service
        url: /v3/api-docs/concert-service
      - name: Payment Service
        url: /v3/api-docs/payment-service
      - name: Ranking Service
        url: /v3/api-docs/ranking-service
      - name: Reserve Service
        url: /v3/api-docs/reserve-service
      - name: Subscription Service
        url: /v3/api-docs/subscription-service
      - name: Notify Service
        url: /v3/api-docs/notify-service
    path: /swagger-ui.html

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-random-string-idol-link-project}
  white-list-path: 
    - /auth/login
    - /auth/login/kakao
    - /auth/reissue
    - /auth/email/**
    - /auth/password/**
    - /users/register
    - /ws-ranking/**
    - /ws-chat/**
    - /sse/notifications
    - /api/rankings/**
    - /search/**
    - /board/posts/**
    - /concerts/**
    - /idols/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /webjars/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
