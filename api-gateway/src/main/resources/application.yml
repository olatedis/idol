server:
  port: 8000

spring:
  application:
    name: apigateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**

        - id: voting-service
          uri: lb://VOTING-SERVICE
          predicates:
            - Path=/api/votes/**

        - id: ranking-service
          uri: lb://RANKING-SERVICE
          predicates:
            - Path=/ws-ranking/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  # 기본값 설정
  secret: ${JWT_SECRET:your-very-long-and-secure-random-string-idol-link-project}
  white-list-path: /auth/login, /auth/reissue, /users/register, /ws-ranking/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
