server:
  port: 8000

spring:
  application:
    name: apigateway-service

  cloud:
    gateway:
      # CORS 설정 (전역) - 프론트엔드(5173) 전용
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173" # 프론트엔드 주소
              - "http://localhost:8000" # Swagger UI (Gateway 자신)
            allowedMethods:
              - GET
              - POST
            allowedHeaders: "*"
            allowCredentials: true # 특정 Origin을 명시했으므로 true 가능 (쿠키/인증헤더 허용)

      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**, /reports/**, /internal/**

        - id: voting-service
          uri: lb://VOTING-SERVICE
          predicates:
            - Path=/api/votes/**

        - id: ranking-service
          uri: lb://RANKING-SERVICE
          predicates:
            - Path=/ws-ranking/**, /api/rankings/**

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chat/**, /ws-chat/**

        # Swagger API Docs 라우팅
        - id: openapi-auth
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: openapi-user
          uri: lb://USER-SERVICE
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: openapi-vote
          uri: lb://VOTING-SERVICE
          predicates:
            - Path=/v3/api-docs/vote-service
          filters:
            - RewritePath=/v3/api-docs/vote-service, /v3/api-docs

        - id: openapi-chat
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/v3/api-docs/chat-service
          filters:
            - RewritePath=/v3/api-docs/chat-service, /v3/api-docs

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# Swagger UI 설정
springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Vote Service
        url: /v3/api-docs/vote-service
      - name: Chat Service
        url: /v3/api-docs/chat-service
    path: /swagger-ui.html

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-random-string-idol-link-project}
  white-list-path: /auth/login, /auth/reissue, /users/register, /ws-ranking/**, /api/rankings/**, /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html, /webjars/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
