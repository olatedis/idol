server:
  port: 8000
  http2:
    enabled: true # HTTP/2 활성화

spring:
  application:
    name: apigateway-service

  codec:
    max-in-memory-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      # CORS 설정 (전역) - 프론트엔드(5173) 전용
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "${FRONTEND_URL:http://localhost:5173}" # 프론트엔드 주소 동적화
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # --- Core Services ---
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30  # 초당 30개 토큰 충전
                redis-rate-limiter.burstCapacity: 100 # 최대 100개까지 버스트 허용
                key-resolver: "#{@ipKeyResolver}"     # IP 기준 제한 (비로그인 구간 유지)
        
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**, /reports/**, /internal/**, /agencies/**, /admin/users/**, /idols/**, /groups/**

        # --- Community Services ---
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chat/**, /ws-chat/**

        - id: board-service
          uri: lb://BOARD-SERVICE
          predicates:
            - Path=/board/posts/**, /board/comments/**, /board/uploads/**, /uploads/**, /notices/**, /admin/notices/**

        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/search/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userIdKeyResolver}"

        # --- Activity Services ---
        - id: voting-service
          uri: lb://VOTING-SERVICE
          predicates:
            - Path=/votes/**, /admin/votes/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userIdKeyResolver}"

        - id: ranking-service-ws
          uri: lb:ws://RANKING-SERVICE
          predicates:
            - Path=/ws-ranking/**

        - id: ranking-service
          uri: lb://RANKING-SERVICE
          predicates:
            - Path=/rankings/**

        - id: concert-service
          uri: lb://CONCERT-SERVICE
          predicates:
            - Path=/concerts/**

        - id: reserve-service
          uri: lb://RESERVE-SERVICE
          predicates:
            - Path=/reservations/**

        # --- Support Services ---
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**

        - id: subscription-service
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/subscriptions/**

        # --- Notify Service ---
        - id: notify-service
          uri: lb://NOTIFY-SERVICE
          predicates:
            - Path=/sse/notifications, /notify/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-random-string-idol-link-project}
  white-list-path: 
    - /auth/login
    - /auth/login/kakao
    - /auth/reissue
    - /auth/email/**
    - /auth/password/**
    - /users/register
    - /ws-ranking/**
    - /ws-chat/**
    - /sse/notifications
    - /rankings/**
    - /search/**
    - /board/posts/**
    - /notices/**
    - /concerts/**
    - /idols/**
    - /groups/**
    - /uploads/**
    - /votes/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG

