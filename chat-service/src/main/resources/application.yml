server:
  port: 8089

spring:
  application:
    name: chat-service
  
  # Spring Cloud 버전 호환성 체크 비활성화
  cloud:
    compatibility-verifier:
      enabled: false
    aws:
      s3:
        bucket: idol--bucket-2026-service
      credentials:
        access-key: ${AWS_ACCESS_KEY:YOUR_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY:YOUR_SECRET_KEY}
      region:
        static: ap-northeast-2
      stack:
        auto: false

  # MongoDB 설정 (채팅 내역 저장)
  data:
    mongodb:
      host: localhost
      port: 27017
      database: idol_chat
      # 계정 설정이 필요하다면 아래 주석을 해제하고 입력하세요
      # authentication-database: admin 
      # username: root
      # password: password

    # Redis 설정 (Pub/Sub 및 채팅방 관리)
    redis:
      host: localhost
      port: 6379

  # Kafka 설정 (Producer & Consumer)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: chat-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # 파일 업로드 크기 제한 (20MB - 동영상 고려)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Swagger 설정 (Gateway 주소 명시)
springdoc:
  servers:
    - url: http://localhost:8000
      description: Gateway Server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Resilience4j 설정 (추가됨)
resilience4j:
  circuitbreaker:
    instances:
      user-check: # 유저 정보 확인용
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      subscription-check: # 구독 확인용
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
