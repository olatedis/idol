server:
  port: 8089
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048

spring:
  application:
    name: chat-service

  # Spring Cloud 버전 호환성 체크 비활성화
  cloud:
    compatibility-verifier:
      enabled: false
    aws:
      s3:
        bucket: idol--bucket-2026-service
      credentials:
        access-key: ${AWS_ACCESS_KEY:YOUR_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY:YOUR_SECRET_KEY}
      region:
        static: ap-northeast-2
      stack:
        auto: false

    # Feign Client 타임아웃 설정
    openfeign:
      compression:
        request:
          enabled: true
          min-request-size: 2048
          mime-types: text/xml,application/xml,application/json
        response:
          enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
      # Feign 설정 (HttpClient 5 적용 + 튜닝)
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: 1000
            max-connections-per-route: 200
            time-to-live: 900
            time-to-live-unit: seconds

  # MongoDB 설정
  data:
    mongodb:
      host: localhost
      port: 27017
      database: idol_chat

    # Redis 설정
    redis:
      host: localhost
      port: 6379

  # Kafka 설정
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
    consumer:
      group-id: chat-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: 3 # 병렬 처리 (파티션 개수만큼 설정)
    topic:
      chat-message: chat-message-topic # 추가됨
      user-report: user-report-topic # 추가됨
      chat-ai-check: chat-ai-check-topic # 추가됨

  # 파일 업로드 크기 제한 (20MB)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# gRPC Client 설정
grpc:
  client:
    auth-service:
      address: static://localhost:9091
      negotiation-type: plaintext

# Swagger 설정
springdoc:
  servers:
    - url: http://localhost:8000
      description: Gateway Server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
resilience4j:
  circuitbreaker:
    instances:
      user-check:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      subscription-check:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

# OpenAI 설정
openai:
  api-key: sk-dummy-key-please-change-me

# DeepL 설정 (번역)
deepl:
  api-key: fake-key


