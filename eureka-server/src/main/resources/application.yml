server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  client:
    # ?? ?? ??? ??? ??? ???? ??
    register-with-eureka: false
    # ?? ??? ??? ??? ??? ??? ?? ??
    fetch-registry: false
  instance:
    # ????? ??
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
