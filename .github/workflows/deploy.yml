name: IDOL Platform CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 깃허브 웹에서 수동 실행 버튼(Run workflow) 생성 옵션

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44

    - name: Export changed files
      run: |
        echo "CHANGED_FILES=${{ steps.changed-files.outputs.all_changed_files }}" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 1. 빌드 및 이미지 전송 (개별 서비스 디렉토리로 이동하여 빌드)
    - name: Build and Push Discovery Service
      if: contains(env.CHANGED_FILES, 'eureka-server/') || github.event_name == 'workflow_dispatch'
      run: |
        cd eureka-server
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-discovery:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-discovery:latest

    - name: Build and Push API Gateway
      if: contains(env.CHANGED_FILES, 'api-gateway/') || github.event_name == 'workflow_dispatch'
      run: |
        cd api-gateway
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-gateway:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-gateway:latest

    - name: Build and Push User Service
      if: contains(env.CHANGED_FILES, 'user-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd user-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-user:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-user:latest

    - name: Build and Push Auth Service
      if: contains(env.CHANGED_FILES, 'auth-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd auth-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-auth:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-auth:latest

    - name: Build and Push Board Service
      if: contains(env.CHANGED_FILES, 'board-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd board-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-board:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-board:latest

    - name: Build and Push Vote Service
      if: contains(env.CHANGED_FILES, 'vote-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd vote-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-vote:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-vote:latest

    - name: Build and Push Search Service
      if: contains(env.CHANGED_FILES, 'search-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd search-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-search:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-search:latest

    - name: Build and Push Ranking Service
      if: contains(env.CHANGED_FILES, 'ranking-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd ranking-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-ranking:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-ranking:latest

    - name: Build and Push Notification Service
      if: contains(env.CHANGED_FILES, 'notify-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd notify-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-notification:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-notification:latest

    - name: Build and Push Chat Service
      if: contains(env.CHANGED_FILES, 'chat-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd chat-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-chat:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-chat:latest

    - name: Build and Push Concert Service
      if: contains(env.CHANGED_FILES, 'concert-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd concert-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-concert:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-concert:latest

    - name: Build and Push Payment Service
      if: contains(env.CHANGED_FILES, 'payment-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd payment-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-payment:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-payment:latest

    - name: Build and Push Reserve Service
      if: contains(env.CHANGED_FILES, 'reserve-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd reserve-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-reserve:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-reserve:latest

    - name: Build and Push Subscription Service
      if: contains(env.CHANGED_FILES, 'subscription-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd subscription-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-subscription:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-subscription:latest

    - name: Build and Push Fanout Service
      if: contains(env.CHANGED_FILES, 'fanout-service/') || github.event_name == 'workflow_dispatch'
      run: |
        cd fanout-service
        chmod +x gradlew
        ./gradlew bootJar
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-fanout:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-fanout:latest

    - name: Build and Push Frontend
      if: contains(env.CHANGED_FILES, 'frontend/') || github.event_name == 'workflow_dispatch'
      run: |
        cd frontend
        npm install --legacy-peer-deps
        npm run build
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idol-frontend:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/idol-frontend:latest
      env:
        # 빌드 시점에 필요한 환경 변수를 GitHub Secrets에서 가져와 주입합니다.
        VITE_API_BASE_URL: "" # Nginx 프록시 사용 시 비워둡니다.
        VITE_KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Copy configuration files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose-prod.yml"
        target: "~/idol"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/idol
          # 배포 스크립트 생성 및 백그라운드 실행 (타임아웃 방지)
          cat << 'EOF' > run_deploy.sh
          #!/bin/bash
          echo "Deployment started at $(date)"
          
          docker image prune -f

          SERVICES=("discovery-service" "api-gateway" "auth-service" "user-service" "frontend" "chat-service" "board-service" "search-service" "vote-service" "concert-service" "payment-service" "reserve-service" "subscription-service" "notification-service" "fanout-service" "ranking-service")

          for service in "${SERVICES[@]}"; do
            echo "Pulling $service..."
            docker compose -f docker-compose-prod.yml pull $service || echo "Failed to pull $service"
            sleep 5
          done

          echo "Starting Infrastructure (Part 1 - DB & Cache)..."
          docker compose -f docker-compose-prod.yml up -d zookeeper redis db mongo
          sleep 20

          echo "Starting Infrastructure (Part 2 - Heavy DBs)..."
          docker compose -f docker-compose-prod.yml up -d kafka elasticsearch
          sleep 30

          echo "Starting Core Discovery & Gateway..."
          docker compose -f docker-compose-prod.yml up -d discovery-service api-gateway
          sleep 20

          echo "Starting Application Services (Part 1)..."
          docker compose -f docker-compose-prod.yml up -d auth-service user-service frontend chat-service board-service
          sleep 20

          echo "Starting Remaining Services..."
          docker compose -f docker-compose-prod.yml up -d
          
          docker image prune -f
          echo "Deployment finished at $(date)"
          EOF

          chmod +x run_deploy.sh
          # 백그라운드에서 스크립트를 실행하고, GitHub 로그는 즉시 성공(Exit 0) 처리
          nohup ./run_deploy.sh > deploy.log 2>&1 &
