plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bit.docker'
version = '0.0.1-SNAPSHOT'
description = 'payment-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.0")
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web' // webmvc -> web 변�?
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Database & Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA 추�?
    implementation 'org.springframework.boot:spring-boot-starter-data-redis' // reactive ?�거 (?�반 redis ?�용 권장)
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.springframework.kafka:spring-kafka'

    // Zipkin & Micrometer Tracing



    // MSA (Eureka - ?�요 ??주석 ?�제)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Jackson Afterburner (JSON ?�능 ?�닝) - 추�???
    implementation 'com.fasterxml.jackson.module:jackson-module-afterburner'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

