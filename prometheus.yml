global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'idol-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081'] # auth-service
      - targets: ['host.docker.internal:8082'] # user-service
      - targets: ['host.docker.internal:8089'] # chat-service
      - targets: ['host.docker.internal:8000'] # api-gateway
      - targets: ['host.docker.internal:8083'] # vote-service
      - targets: ['host.docker.internal:8097'] # board-service
      - targets: ['host.docker.internal:8761'] # eureka-server (유레카는 8761 포트)
      - targets: ['host.docker.internal:8095'] # fanout-service
      - targets: ['host.docker.internal:8096'] # notify-service
      - targets: ['host.docker.internal:8090'] # search-service
      - targets: ['host.docker.internal:8084'] # concert-service
      - targets: ['host.docker.internal:8087'] # payment-service
      - targets: ['host.docker.internal:8085'] # ranking-service
      - targets: ['host.docker.internal:8086'] # reserve-service
      - targets: ['host.docker.internal:8088'] # subscription-service
